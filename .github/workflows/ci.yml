name: ci

on:
  push:
    branches:
      - noetic
  pull_request:
    branches:
      - noetic
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compliance-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate visual package boundary
        run: |
          set -euo pipefail
          git diff --check
          .xgc2/scripts/check_package_compliance.sh

  build-debs:
    needs: compliance-and-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and install-check Noetic Deb
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          .xgc2/scripts/build_debs_in_docker.sh --work-dir "$RUNNER_TEMP/xgc2-b2arx-noetic-${{ matrix.arch }}" --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-b2arx-noetic-deb-${{ matrix.arch }}
          path: debs/*.deb
          if-no-files-found: error
          retention-days: 14
