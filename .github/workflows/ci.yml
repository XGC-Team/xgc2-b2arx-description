name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  compliance-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compliance
        run: .xgc2/scripts/check_package_compliance.sh
      - name: Visual asset unit tests
        run: python3 -m unittest discover -s test -v
